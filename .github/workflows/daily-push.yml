name: Daily Push Automation

on:
  schedule:
    # 每天早上8点运行（UTC时间0点，北京时间8点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

env:
  MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
  MIMO_API_BASE: ${{ secrets.MIMO_API_BASE || 'https://token-plan-cn.xiaomimimo.com/v1' }}
  PUSH_METHOD: ${{ secrets.PUSH_METHOD || 'pushplus' }}
  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}

jobs:
  daily-push:
    name: 每日推送
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create data directory
      run: mkdir -p data
    
    - name: Run Zhouyi push
      id: zhouyi
      run: |
        python -c "
        from automation import automation_manager
        result = automation_manager.run_task('每日周易推送')
        if result:
            print('周易推送完成')
            with open('data/zhouyi_latest.txt', 'w', encoding='utf-8') as f:
                f.write(result)
        else:
            print('周易推送失败')
            exit(1)
        "
    
    - name: Run Poetry push
      id: poetry
      run: |
        python -c "
        from automation import automation_manager
        result = automation_manager.run_task('每日古诗谚语推送')
        if result:
            print('古诗推送完成')
            with open('data/poetry_latest.txt', 'w', encoding='utf-8') as f:
                f.write(result)
        else:
            print('古诗推送失败')
            exit(1)
        "
    
    - name: Commit and push data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --staged --quiet || git commit -m "更新每日推送内容 [$(date +'%Y-%m-%d')]"
        git push
    
    - name: Upload data artifacts
      uses: actions/upload-artifact@v4
      with:
        name: daily-push-data
        path: data/
        retention-days: 30
    
    - name: Send notification
      if: env.WEBHOOK_URL != ''
      run: |
        curl -X POST "${{ env.WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "每日推送任务完成\n周易推送: ${{ steps.zhouyi.outcome }}\n古诗推送: ${{ steps.poetry.outcome }}"
          }'
      
    - name: Console notification
      run: |
        echo "=== 每日推送任务完成 ==="
        echo "周易推送: ${{ steps.zhouyi.outcome }}"
        echo "古诗推送: ${{ steps.poetry.outcome }}"
        echo "========================"